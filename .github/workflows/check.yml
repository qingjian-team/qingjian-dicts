# 每次推送与 PR 都检查：dict.toml 与数据文件（tools/check.py），以及构建产物、超大文件没进仓库（同 .githooks/pre-commit，贡献者不一定启用了钩子）。
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 词库检查
        run: python3 tools/check.py

      - name: 构建产物与超大文件
        run: |
          status=0
          built="$(git ls-files '*.qj' '*.qjz' '*.qjm')"
          if [ -n "$built" ]; then
            echo "::error::构建产物只发 Release 附件，不进仓库：$built"
            status=1
          fi
          while IFS= read -r file; do
            size=$(stat -c %s "$file")
            if [ "$size" -gt 50000000 ]; then
              echo "::error file=$file::$size 字节，超过 50MB，按 CONTRIBUTING.md 拆开"
              status=1
            fi
          done < <(git ls-files)
          exit $status
